<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FeedDeck</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/base.css"/>
<style>
body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px 32px;
  width: 100%;
  max-width: 320px;
}

.login-brand {
  text-align: center;
  margin-bottom: 32px;
}

.login-brand h1 {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 400;
  color: var(--primary);
  letter-spacing: -0.5px;
}

.login-brand p {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}

.login-form { display: flex; flex-direction: column; gap: 16px; }

.input-wrap {
  position: relative;
}

.input-wrap .material-symbols-outlined {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  color: var(--text-muted);
}

.input-wrap .form-input {
  padding-left: 38px;
  height: 44px;
}

.login-error {
  display: none;
  font-size: 12px;
  color: var(--error);
  margin-top: -8px;
}

.login-error.show { display: block; }

.login-btn {
  width: 100%;
  height: 44px;
  font-size: 14px;
}
</style>
</head>
<body>

<div class="login-card">
  <div class="login-brand">
    <h1>FeedDeck</h1>
    <p>信息流仪表板</p>
  </div>

  <form class="login-form" id="loginForm">
    <div class="input-wrap">
      <span class="material-symbols-outlined">lock</span>
      <input class="form-input" type="password" id="pwd" placeholder="请输入密码" required autocomplete="current-password"/>
    </div>
    <div class="login-error" id="loginError">密码错误，请重试</div>
    <button class="btn btn-primary login-btn" type="submit">登录</button>
  </form>
</div>

<script src="js/api.js"></script>
<script>
(function () {
  var form = document.getElementById('loginForm');
  var pwd = document.getElementById('pwd');
  var err = document.getElementById('loginError');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var password = pwd.value.trim();
    if (!password) return;

    err.classList.remove('show');

    api.login(password).then(function () {
      window.location.href = 'dashboard.html';
    }).catch(function () {
      err.classList.add('show');
      pwd.value = '';
      pwd.focus();
    });
  });

  pwd.addEventListener('input', function () {
    err.classList.remove('show');
  });
})();
</script>
</body>
</html>
