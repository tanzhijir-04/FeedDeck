<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FeedDeck</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/base.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Flip.min.js"></script>
<style>
/* ===== GRID ===== */
.grid {
  width: 100vw;
  height: 100vh;
  display: grid;
  gap: var(--gap);
  padding: var(--gap);
}

/* ===== HOT SEARCH ===== */
.hot-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.hot-list::-webkit-scrollbar { display: none; }
.hot-list { -ms-overflow-style: none; scrollbar-width: none; }

.hot-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
}

.hot-item:last-child { border-bottom: none; }

.hot-item:active {
  background: var(--surface-alt);
}

.hot-rank {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display-en), Georgia, serif;
  font-size: 11px;
  font-weight: 500;
  flex-shrink: 0;
}

.hot-rank.top { background: var(--primary); color: #fff; }
.hot-rank.normal { background: var(--surface-alt); color: var(--text-muted); }

.hot-content {
  flex: 1;
  min-width: 0;
}

.hot-text {
  font-size: var(--text-sm);
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1.3;
}

.hot-heat {
  font-family: var(--font-display-en), Georgia, serif;
  font-size: 11px;
  color: var(--text-muted);
  flex-shrink: 0;
  white-space: nowrap;
}

/* ===== NEWS ===== */
.news-item {
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
}

.news-item:last-child { border-bottom: none; }

.news-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 2px;
}

.news-source {
  font-size: 10px;
  color: var(--text-muted);
}

.news-title {
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.35;
}

.news-time {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* ===== TODOS ===== */
.todo-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
}

.todo-item:last-child { border-bottom: none; }

.todo-check {
  width: 16px; height: 16px;
  border: 2px solid var(--text-muted);
  border-radius: 3px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: transparent;
}

.todo-check:hover { border-color: var(--primary); }

.todo-check.done {
  background: var(--primary);
  border-color: var(--primary);
}

.todo-check.done::after {
  content: '✓';
  color: #fff;
  font-size: 10px;
  font-weight: 700;
}

.todo-text {
  flex: 1;
  font-size: 12px;
  color: var(--text);
}

.todo-item.done .todo-text {
  text-decoration: line-through;
  color: var(--text-muted);
}

.todo-deadline {
  font-size: 10px;
  color: var(--text-muted);
  flex-shrink: 0;
}

.todo-deadline.overdue { color: var(--error); font-weight: 500; }

/* ===== SCHEDULE ===== */
.schedule-item {
  display: flex;
  gap: 8px;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
}

.schedule-item:last-child { border-bottom: none; }

.schedule-time {
  font-family: var(--font-display-en), Georgia, serif;
  font-size: var(--text-xs);
  color: var(--text-muted);
  width: 80px;
  flex-shrink: 0;
  font-weight: 400;
  padding-top: 1px;
}

.schedule-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 4px;
}

.schedule-content { flex: 1; }

.schedule-title {
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
}

.schedule-desc {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 1px;
}

/* ===== WEATHER — Editorial Style (Adaptive) ===== */
.weather-editorial {
  overflow: hidden;
  align-content: start;
}

.weather-editorial .card-body {
  padding: 0;
}

/* 主容器 */
.weather-editorial .wx-container {
  display: flex;
  flex-direction: column;
}

/* 头部区域 */
.wx-header {
  padding: var(--card-pad);
  padding-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.wx-header-left {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.wx-city {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 400;
  color: var(--text);
  letter-spacing: -0.3px;
}

.wx-desc-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.wx-desc {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 400;
  color: var(--text-dim);
}

.wx-update {
  font-size: var(--text-xs);
  color: var(--text-muted);
}

.wx-header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.wx-icon-main {
  font-size: 44px;
  color: var(--coral);
}

.wx-temp-row {
  display: flex;
  align-items: flex-start;
}

.wx-temp {
  font-family: var(--font-display-en), Georgia, serif;
  font-size: var(--text-3xl);
  font-weight: 300;
  color: var(--text);
  line-height: 1;
  letter-spacing: -1px;
}

.wx-degree {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  color: var(--text-dim);
  margin-top: 6px;
}

/* 详情网格 */
.wx-details {
  padding: 0 var(--card-pad) var(--card-pad);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.wx-detail-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px 6px;
  background: var(--surface-low);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: background 0.2s;
}

.wx-detail-item:active {
  background: var(--surface-alt);
}

.wx-detail-label {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  margin-bottom: 3px;
}

.wx-detail-value {
  font-family: var(--font-display-en), Georgia, serif;
  font-size: var(--text-lg);
  font-weight: 500;
  color: var(--text);
}

/* 日出日落 */
.wx-sun {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--card-pad);
  background: var(--surface-low);
  border-radius: var(--radius);
  margin: 0 var(--card-pad);
}

.wx-sun-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.wx-sun-icon {
  font-size: 24px;
  color: var(--coral);
}

.wx-sun-label {
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--text-muted);
}

.wx-sun-time {
  font-family: var(--font-display-en), Georgia, serif;
  font-size: var(--text-lg);
  font-weight: 500;
  color: var(--text);
}

.wx-sun-divider {
  flex: 1;
  height: 1px;
  background: var(--border);
  margin: 0 16px;
}

/* 辅助卡片区域 */
.wx-secondary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: var(--card-pad);
  padding-top: 8px;
}

/* 空气质量卡片 */
.wx-aqi {
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.wx-aqi-title {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
}

.wx-aqi-title .material-symbols-outlined {
  font-size: 14px;
}

.wx-aqi-content {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}

.wx-aqi-level {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  color: var(--text);
  line-height: 1;
}

.wx-aqi-desc {
  font-size: var(--text-xs);
  color: var(--text-muted);
  margin-top: 3px;
}

.wx-aqi-bar {
  width: 4px;
  height: 32px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.wx-aqi-bar-fill {
  width: 100%;
  border-radius: 2px;
  transition: height 0.3s;
}

/* 生活建议卡片 */
.wx-tip {
  padding: 12px;
  border-radius: var(--radius);
  background: var(--primary);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
}

.wx-tip-title {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: rgba(255,255,255,0.8);
}

.wx-tip-text {
  font-family: var(--font-display);
  font-size: var(--text-sm);
  color: #fff;
  line-height: 1.5;
}

/* ===== SOCIAL ===== */
.social-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  height: 100%;
  align-content: center;
}

.social-stat {
  text-align: center;
  padding: 12px 8px;
  background: var(--surface-alt);
  border-radius: var(--radius);
}

.social-stat-icon {
  font-size: 22px;
  margin-bottom: 4px;
}

.social-stat-value {
  font-family: var(--font-display-en), Georgia, serif;
  font-size: var(--text-2xl);
  font-weight: 300;
  color: var(--text);
}

.social-stat-label {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 2px;
}

.social-stat-change {
  font-size: 10px;
  font-weight: 500;
  margin-top: 3px;
}

.social-stat-change.up { color: var(--success); }
.social-stat-change.down { color: var(--error); }

/* ===== DATA VALUES (大数字轻字重) ===== */
.data-value {
  font-family: var(--font-display-en), Georgia, serif;
  font-weight: 300;
  color: var(--text);
}

.data-label {
  font-size: var(--text-xs);
  color: var(--text-muted);
  font-weight: 400;
}

.data-change {
  font-size: var(--text-xs);
  font-weight: 500;
}

.data-change.up   { color: var(--success); }
.data-change.down { color: var(--error); }
</style>
</head>
<body>

<div class="grid">

  <!-- 热搜榜单 -->
  <div class="card" data-card="hotsearch">
    <div class="card-header">
      <div>
        <div class="card-title">热搜榜单</div>
        <div class="card-subtitle">实时热点追踪</div>
      </div>
      <div class="tabs" id="hotTabs">
        <button class="tab active" data-platform="weibo">微博</button>
        <button class="tab" data-platform="zhihu">知乎</button>
        <button class="tab" data-platform="bilibili">B站</button>
        <button class="tab" data-platform="douyin">抖音</button>
      </div>
    </div>
    <div class="card-body">
      <ul class="hot-list" id="hotList"></ul>
    </div>
  </div>

  <!-- 行业资讯 -->
  <div class="card" data-card="news">
    <div class="card-header">
      <div>
        <div class="card-title">行业资讯</div>
        <div class="card-subtitle" id="newsCount">-- 个订阅源</div>
      </div>
    </div>
    <div class="card-body" id="newsBody">
      <div class="skeleton skeleton-line w-full"></div>
      <div class="skeleton skeleton-line w-3-4"></div>
      <div class="skeleton skeleton-line w-1-2"></div>
    </div>
  </div>

  <!-- 待办事项 -->
  <div class="card" data-card="todo">
    <div class="card-header">
      <div>
        <div class="card-title">待办事项</div>
        <div class="card-subtitle" id="todoStats">-- 项待完成</div>
      </div>
    </div>
    <div class="card-body" id="todoBody">
      <div class="skeleton skeleton-line w-full"></div>
      <div class="skeleton skeleton-line w-3-4"></div>
    </div>
  </div>

  <!-- 今日日程 -->
  <div class="card" data-card="schedule">
    <div class="card-header">
      <div>
        <div class="card-title">今日日程</div>
        <div class="card-subtitle" id="scheduleDate">--</div>
      </div>
    </div>
    <div class="card-body" id="scheduleBody">
      <div class="skeleton skeleton-line w-full"></div>
      <div class="skeleton skeleton-line w-1-2"></div>
    </div>
  </div>

  <!-- 天气 -->
  <div class="card weather-editorial" data-card="weather">
    <div class="card-body" id="weatherBody">
      <div class="skeleton skeleton-line w-full" style="height:40px;"></div>
      <div class="skeleton skeleton-line w-3-4"></div>
    </div>
  </div>

  <!-- 社交媒体 -->
  <div class="card" data-card="social">
    <div class="card-header">
      <div>
        <div class="card-title">社交媒体</div>
        <div class="card-subtitle">粉丝数据概览</div>
      </div>
    </div>
    <div class="card-body" id="socialBody">
      <div class="social-grid">
        <div class="social-stat">
          <div class="social-stat-icon material-symbols-outlined">smart_display</div>
          <div class="social-stat-value">--</div>
          <div class="social-stat-label">B站</div>
        </div>
      </div>
    </div>
  </div>

</div>


<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  'use strict';

  // ===== 注册 GSAP 插件 =====
  gsap.registerPlugin(Flip);

  // ===== 登录检查 =====
  api.checkAuth().catch(function () {
    window.location.href = '/';
  });

  // ===== 日期（显示在日程卡片） =====
  document.getElementById('scheduleDate').textContent = app.formatDate();

  // ===== 布局系统 =====
  var layouts = {
    landscape: {
      S0: { cols: '1fr 1fr 1fr', rows: '1fr 1fr' },
      S1: { cols: '1fr 1fr 1fr', rows: '1fr 1fr' },
      S2: { cols: '1fr 1fr 1fr', rows: '1fr 1fr' },
      S3: { cols: '1fr 1fr', rows: '1fr 1fr' }
    },
    portrait: {
      S0: { cols: '1fr 1fr', rows: '1fr 1fr 1fr' },
      S1: { cols: '1fr 1fr', rows: '1fr 1fr 1fr' },
      S2: { cols: '1fr 1fr', rows: '1fr 1fr 1fr' },
      S3: { cols: '1fr 1fr', rows: '1fr 1fr' }
    }
  };

  var cardPositions = {
    landscape: {
      S0: { hotsearch: '1 / 1', news: '2 / 1', todo: '3 / 1', schedule: '1 / 2', weather: '2 / 2', social: '3 / 2' },
      S1: { hotsearch: '1 / 1', news: '2 / 1', todo: '3 / 1', weather: '1 / 2 span 2', social: '3 / 2' },
      S2: { hotsearch: '1 / 1', news: '2 / 1', schedule: '3 / 1', weather: '1 / 2 span 2', social: '3 / 2' },
      S3: { hotsearch: '1 / 1', news: '2 / 1', weather: '1 / 2', social: '2 / 2' }
    },
    portrait: {
      S0: { hotsearch: '1 / 1', news: '2 / 1', todo: '1 / 2', schedule: '2 / 2', weather: '1 / 3', social: '2 / 3' },
      S1: { hotsearch: '1 / 1', news: '2 / 1', weather: '1 / 2', social: '2 / 2', todo: '1 / 3 span 2' },
      S2: { hotsearch: '1 / 1', news: '2 / 1', weather: '1 / 2', social: '2 / 2', schedule: '1 / 3 span 2' },
      S3: { hotsearch: '1 / 1', news: '2 / 1', weather: '1 / 2', social: '2 / 2' }
    }
  };

  // 卡片优先级（数字越小优先级越高）
  var cardPriority = {
    hotsearch: 1,
    news: 2,
    weather: 3,
    social: 4,
    todo: 5,
    schedule: 6
  };

  // ===== 防抖机制 =====
  var emptyTimers = { todo: null, schedule: null };
  var HIDE_DELAY = 5000; // 5秒后隐藏空卡片

  // ===== 状态管理 =====
  var dashboardData = null;
  var currentPlatform = 'weibo';
  var currentState = 'S0';
  var currentData = null;

  // ===== 工具函数 =====
  function getTodayEvents(calendar) {
    var _n = new Date();
    var today = _n.getFullYear() + '-' + String(_n.getMonth() + 1).padStart(2, '0') + '-' + String(_n.getDate()).padStart(2, '0');
    return (calendar && calendar.events || []).filter(function (evt) {
      return evt.start_time && evt.start_time.slice(0, 10) === today;
    });
  }

  function isLandscape() {
    return window.innerWidth > window.innerHeight;
  }

  function getOrientation() {
    return isLandscape() ? 'landscape' : 'portrait';
  }

  // ===== 状态检测 =====
  function detectState(data) {
    var hasTodos = data.todos && data.todos.items && data.todos.items.length > 0;
    var hasSchedule = getTodayEvents(data.calendar).length > 0;

    if (hasTodos && hasSchedule) return 'S0';
    if (hasTodos && !hasSchedule) return 'S1';
    if (!hasTodos && hasSchedule) return 'S2';
    return 'S3';
  }

  // 隐藏状态追踪
  var hiddenByEmpty = { todo: false, schedule: false };

  function updateEmptyTimers(data) {
    var hasTodos = data.todos && data.todos.items && data.todos.items.length > 0;
    var hasSchedule = getTodayEvents(data.calendar).length > 0;

    // 待办事项
    if (hasTodos) {
      // 有数据，取消定时器并恢复显示
      if (emptyTimers.todo) {
        clearTimeout(emptyTimers.todo);
        emptyTimers.todo = null;
      }
      if (hiddenByEmpty.todo) {
        hiddenByEmpty.todo = false;
        showCards(['todo']);
      }
    } else if (!emptyTimers.todo && !hiddenByEmpty.todo) {
      // 无数据，启动5秒定时器
      emptyTimers.todo = setTimeout(function () {
        emptyTimers.todo = null;
        hiddenByEmpty.todo = true;
        hideCards(['todo']);
        flipLayout(currentState, getEffectiveState(currentData));
      }, HIDE_DELAY);
    }

    // 日程
    if (hasSchedule) {
      // 有数据，取消定时器并恢复显示
      if (emptyTimers.schedule) {
        clearTimeout(emptyTimers.schedule);
        emptyTimers.schedule = null;
      }
      if (hiddenByEmpty.schedule) {
        hiddenByEmpty.schedule = false;
        showCards(['schedule']);
      }
    } else if (!emptyTimers.schedule && !hiddenByEmpty.schedule) {
      // 无数据，启动5秒定时器
      emptyTimers.schedule = setTimeout(function () {
        emptyTimers.schedule = null;
        hiddenByEmpty.schedule = true;
        hideCards(['schedule']);
        flipLayout(currentState, getEffectiveState(currentData));
      }, HIDE_DELAY);
    }
  }

  function getEffectiveState(data) {
    var hasTodos = !hiddenByEmpty.todo && data.todos && data.todos.items && data.todos.items.length > 0;
    var hasSchedule = !hiddenByEmpty.schedule && getTodayEvents(data.calendar).length > 0;

    if (hasTodos && hasSchedule) return 'S0';
    if (hasTodos && !hasSchedule) return 'S1';
    if (!hasTodos && hasSchedule) return 'S2';
    return 'S3';
  }

  // ===== 布局应用 =====
  function applyLayout(state) {
    var orientation = getOrientation();
    var layout = layouts[orientation][state];
    var positions = cardPositions[orientation][state];

    var grid = document.querySelector('.grid');
    grid.style.gridTemplateColumns = layout.cols;
    grid.style.gridTemplateRows = layout.rows;

    // 设置每张卡片的位置和可见性
    document.querySelectorAll('[data-card]').forEach(function (card) {
      var cardId = card.getAttribute('data-card');
      if (positions[cardId]) {
        var pos = positions[cardId].split(' ');
        card.style.gridColumn = pos[0];
        card.style.gridRow = pos[1] || '';
        card.style.display = '';
      } else {
        card.style.display = 'none';
      }
    });
  }

  function getVisibleCards(state) {
    var orientation = getOrientation();
    return Object.keys(cardPositions[orientation][state]);
  }

  function getHiddenCards(oldState, newState) {
    var oldVisible = getVisibleCards(oldState);
    var newVisible = getVisibleCards(newState);
    return oldVisible.filter(function (id) { return newVisible.indexOf(id) === -1; });
  }

  function getShownCards(oldState, newState) {
    var oldVisible = getVisibleCards(oldState);
    var newVisible = getVisibleCards(newState);
    return newVisible.filter(function (id) { return oldVisible.indexOf(id) === -1; });
  }

  // ===== GSAP 动画 =====
  async function hideCards(cardIds) {
    var cards = cardIds.map(function (id) { return document.querySelector('[data-card="' + id + '"]'); }).filter(Boolean);
    if (!cards.length) return;

    // 阶段1：空态闪现（1.5秒）
    await new Promise(function (r) { setTimeout(r, 1500); });

    // 阶段2：卡片退场（250ms + stagger）
    gsap.to(cards, {
      autoAlpha: 0,
      scale: 0.96,
      duration: 0.25,
      stagger: { amount: 0.08, from: 'edges' },
      ease: 'power2.out'
    });

    // 等待退场动画完成
    await new Promise(function (r) { setTimeout(r, 350) });

    // 设置 display: none
    cards.forEach(function (card) { card.style.display = 'none'; });
  }

  function flipLayout(oldState, newState) {
    // First: 记录当前状态
    var state = Flip.getState('[data-card]');

    // Last: 应用新布局
    applyLayout(newState);

    // Invert + Play: 动画过渡
    Flip.from(state, {
      duration: 0.35,
      ease: 'power2.out',
      scale: true,
      absolute: false,
      nested: false
    });
  }

  async function showCards(cardIds) {
    var cards = cardIds.map(function (id) { return document.querySelector('[data-card="' + id + '"]'); }).filter(Boolean);
    if (!cards.length) return;

    // 取消 display: none，设置初始状态
    cards.forEach(function (card) {
      card.style.display = '';
      gsap.set(card, { autoAlpha: 0, scale: 0.96 });
    });

    // FLIP 让位
    var state = Flip.getState('[data-card]');
    applyLayout(currentState);
    Flip.from(state, { duration: 0.35, ease: 'power2.out', scale: true });

    // 渐入动画（不需要空态闪现）
    gsap.to(cards, {
      autoAlpha: 1,
      scale: 1,
      duration: 0.2,
      stagger: 0.08,
      ease: 'power2.out'
    });
  }

  // ===== 渲染函数 =====
  function renderHotList(platform) {
    var list = document.getElementById('hotList');
    if (!dashboardData || !dashboardData.hotsearch || !dashboardData.hotsearch.platforms) {
      list.innerHTML = '<li class="hot-item"><span class="hot-text" style="color:var(--text-muted);">暂无数据</span></li>';
      return;
    }
    var data = dashboardData.hotsearch.platforms[platform] || [];
    if (!data.length) {
      list.innerHTML = '<li class="hot-item"><span class="hot-text" style="color:var(--text-muted);">暂无数据</span></li>';
      return;
    }
    list.innerHTML = data.map(function (item) {
      return '<li class="hot-item">' +
        '<span class="hot-rank ' + (item.rank <= 3 ? 'top' : 'normal') + '">' + item.rank + '</span>' +
        '<span class="hot-content"><span class="hot-text">' + item.title + '</span></span>' +
        '<span class="hot-heat">' + (item.heat || '') + '</span>' +
      '</li>';
    }).join('');
  }

  function renderNews(items) {
    var body = document.getElementById('newsBody');
    if (!items || !items.length) {
      body.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);">暂无资讯</div>';
      return;
    }
    document.getElementById('newsCount').textContent = items.length + ' 条资讯';
    body.innerHTML = items.map(function (item) {
      var link = item.link ? '<a href="' + item.link + '" target="_blank" style="color:inherit;text-decoration:none;">' : '';
      var linkEnd = item.link ? '</a>' : '';
      var time = item.published_at ? app.timeAgo(new Date(item.published_at).getTime()) : '';
      return '<div class="news-item">' +
        '<div class="news-title">' + link + item.title + linkEnd + '</div>' +
        '<div class="news-time">' + time + '</div>' +
      '</div>';
    }).join('');
  }

  var todos = [];

  function renderTodos(items) {
    todos = items || [];
    var body = document.getElementById('todoBody');
    var pending = todos.filter(function (t) { return !t.completed; }).length;
    document.getElementById('todoStats').textContent = pending + ' 项待完成';
    if (!todos.length) {
      body.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);">暂无待办</div>';
      return;
    }
    body.innerHTML = todos.map(function (item) {
      var dl = item.deadline ? '<span class="todo-deadline">' + item.deadline + '</span>' : '';
      return '<div class="todo-item ' + (item.completed ? 'done' : '') + '">' +
        '<div class="todo-check ' + (item.completed ? 'done' : '') + '" data-id="' + item.id + '"></div>' +
        '<span class="todo-text">' + item.title + '</span>' +
        dl +
      '</div>';
    }).join('');
  }

  function renderSchedule(events) {
    var body = document.getElementById('scheduleBody');
    if (!events || !events.length) {
      body.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);">今日无日程</div>';
      return;
    }
    var colors = ['#22c55e', '#f97316', '#3b82f6', '#a855f7', '#ef4444'];
    body.innerHTML = events.map(function (item, i) {
      var start = '';
      if (item.start_time) {
        start = item.start_time.length > 10 ? item.start_time.slice(11, 16) : '全天';
      }
      var end = '';
      if (item.end_time) {
        end = item.end_time.length > 10 ? item.end_time.slice(11, 16) : '';
      }
      var time = end ? start + ' - ' + end : start;
      var color = colors[i % colors.length];
      return '<div class="schedule-item">' +
        '<div class="schedule-time">' + time + '</div>' +
        '<div class="schedule-dot" style="background:' + color + '"></div>' +
        '<div class="schedule-content">' +
          '<div class="schedule-title">' + item.title + '</div>' +
          (item.description ? '<div class="schedule-desc">' + item.description + '</div>' : '') +
        '</div>' +
      '</div>';
    }).join('');
  }

  var wmoDescriptions = {
    0: '晴', 1: '多云', 2: '多云', 3: '多云',
    45: '雾', 48: '雾',
    51: '毛毛雨', 53: '毛毛雨', 55: '毛毛雨',
    61: '雨', 63: '雨', 65: '雨',
    71: '雪', 73: '雪', 75: '雪',
    95: '雷阵雨', 96: '雷阵雨', 99: '雷阵雨'
  };

  // AQI等级描述
  function getAqiInfo(aqi) {
    if (aqi == null) return { level: '--', desc: '暂无数据', color: 'var(--text-muted)', pct: 0 };
    var v = Math.round(aqi);
    if (v <= 20) return { level: '优', desc: 'AQI ' + v, color: '#22c55e', pct: v / 100 };
    if (v <= 40) return { level: '良', desc: 'AQI ' + v, color: '#84cc16', pct: v / 100 };
    if (v <= 60) return { level: '中', desc: 'AQI ' + v, color: '#eab308', pct: v / 100 };
    if (v <= 80) return { level: '较差', desc: 'AQI ' + v, color: '#f97316', pct: v / 100 };
    return { level: '差', desc: 'AQI ' + v, color: '#ef4444', pct: Math.min(v / 100, 1) };
  }

  // 根据天气生成生活建议
  function getWeatherTip(code, temp) {
    if (temp != null && temp < 0) return '今天气温较低，注意保暖，外出请穿厚外套。';
    if (temp != null && temp > 35) return '高温天气，尽量避免户外活动，注意防暑降温。';
    if (code >= 61 && code <= 65) return '今天有雨，出门记得带伞，注意路面湿滑。';
    if (code >= 71 && code <= 75) return '今天有雪，路面可能结冰，外出请小心慢行。';
    if (code >= 95) return '雷阵雨天气，避免户外活动，远离高处和水域。';
    if (code >= 45 && code <= 48) return '今天有雾，能见度低，开车请减速慢行。';
    return '今天天气不错，非常适合外出散步，享受好时光。';
  }

  var wmoIcons = {
    0: 'light_mode', 1: 'partly_cloudy_day', 2: 'partly_cloudy_day', 3: 'partly_cloudy_day',
    45: 'foggy', 48: 'foggy',
    51: 'rainy', 53: 'rainy', 55: 'rainy',
    61: 'rainy', 63: 'rainy', 65: 'rainy',
    71: 'weather_snowy', 73: 'weather_snowy', 75: 'weather_snowy',
    95: 'thunderstorm', 96: 'thunderstorm', 99: 'thunderstorm'
  };

  function renderWeather(weatherData) {
    var body = document.getElementById('weatherBody');
    var wx = weatherData && weatherData.data;
    if (!wx || !wx.current) {
      body.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);">暂无天气数据</div>';
      return;
    }
    var c = wx.current;
    var d = wx.daily || {};
    var code = c.weather_code || 0;
    var desc = wmoDescriptions[code] || '未知';
    var icon = wmoIcons[code] || 'cloud';
    var temp = Math.round(c.temperature_2m || 0);
    var feelsLike = Math.round(c.apparent_temperature || temp);
    var humidity = c.relative_humidity_2m || '--';
    var wind = c.wind_speed_10m || '--';
    var uvIndex = c.uv_index != null ? c.uv_index.toFixed(1) : '--';
    var tempMax = d.temperature_2m_max ? Math.round(d.temperature_2m_max[0]) : '--';
    var tempMin = d.temperature_2m_min ? Math.round(d.temperature_2m_min[0]) : '--';
    var sunrise = d.sunrise && d.sunrise[0] ? d.sunrise[0].slice(11, 16) : '--';
    var sunset = d.sunset && d.sunset[0] ? d.sunset[0].slice(11, 16) : '--';
    var city = dashboardData && dashboardData.weather_city ? dashboardData.weather_city : '未知';
    var aqi = c.european_aqi;
    var aqiInfo = getAqiInfo(aqi);
    var tip = getWeatherTip(code, c.temperature_2m);

    body.innerHTML =
      '<div class="wx-container">' +
        '<div class="wx-header">' +
          '<div class="wx-header-left">' +
            '<div class="wx-city">' + city + '</div>' +
            '<div class="wx-desc-row">' +
              '<span class="wx-desc">' + desc + '</span>' +
              '<span class="wx-update">每5分钟更新</span>' +
            '</div>' +
          '</div>' +
          '<div class="wx-header-right">' +
            '<span class="material-symbols-outlined wx-icon-main">' + icon + '</span>' +
            '<div class="wx-temp-row">' +
              '<span class="wx-temp">' + temp + '</span>' +
              '<span class="wx-degree">°</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="wx-details">' +
          '<div class="wx-detail-item">' +
            '<span class="wx-detail-label">体感</span>' +
            '<span class="wx-detail-value">' + feelsLike + '°</span>' +
          '</div>' +
          '<div class="wx-detail-item">' +
            '<span class="wx-detail-label">湿度</span>' +
            '<span class="wx-detail-value">' + humidity + '%</span>' +
          '</div>' +
          '<div class="wx-detail-item">' +
            '<span class="wx-detail-label">风速</span>' +
            '<span class="wx-detail-value">' + wind + ' km/h</span>' +
          '</div>' +
          '<div class="wx-detail-item">' +
            '<span class="wx-detail-label">最高</span>' +
            '<span class="wx-detail-value">' + tempMax + '°</span>' +
          '</div>' +
          '<div class="wx-detail-item">' +
            '<span class="wx-detail-label">最低</span>' +
            '<span class="wx-detail-value">' + tempMin + '°</span>' +
          '</div>' +
          '<div class="wx-detail-item">' +
            '<span class="wx-detail-label">紫外线</span>' +
            '<span class="wx-detail-value">' + uvIndex + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="wx-sun">' +
          '<div class="wx-sun-item">' +
            '<span class="material-symbols-outlined wx-sun-icon">wb_sunny</span>' +
            '<span class="wx-sun-label">日出</span>' +
            '<span class="wx-sun-time">' + sunrise + '</span>' +
          '</div>' +
          '<div class="wx-sun-divider"></div>' +
          '<div class="wx-sun-item">' +
            '<span class="wx-sun-label">日落</span>' +
            '<span class="wx-sun-time">' + sunset + '</span>' +
            '<span class="material-symbols-outlined wx-sun-icon">bedtime</span>' +
          '</div>' +
        '</div>' +
        '<div class="wx-secondary">' +
          '<div class="wx-aqi">' +
            '<div class="wx-aqi-title">' +
              '<span class="material-symbols-outlined">airwave</span> 空气质量' +
            '</div>' +
            '<div class="wx-aqi-content">' +
              '<div>' +
                '<div class="wx-aqi-level">' + aqiInfo.level + '</div>' +
                '<div class="wx-aqi-desc">' + aqiInfo.desc + '</div>' +
              '</div>' +
              '<div class="wx-aqi-bar">' +
                '<div class="wx-aqi-bar-fill" style="height:' + (aqiInfo.pct * 100) + '%;background:' + aqiInfo.color + ';"></div>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="wx-tip">' +
            '<div class="wx-tip-title">生活建议</div>' +
            '<div class="wx-tip-text">' + tip + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  var platformConfig = {
    bilibili: { label: 'B站', icon: 'smart_display' },
    youtube: { label: 'YouTube', icon: 'play_circle' },
    twitter: { label: 'Twitter/X', icon: 'tag' },
    instagram: { label: 'Instagram', icon: 'photo_camera' }
  };

  function renderSocial(accounts) {
    var body = document.getElementById('socialBody');
    var configuredPlatforms = accounts ? Object.keys(accounts) : [];

    if (configuredPlatforms.length === 0) {
      body.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);">请在配置中心添加社交媒体账号</div>';
      return;
    }

    var html = '<div class="social-grid">';
    configuredPlatforms.forEach(function (platformKey) {
      var config = platformConfig[platformKey];
      if (!config) return;

      var data = accounts[platformKey];
      var value = data && data.follower_count != null ? data.follower_count.toLocaleString() : '--';

      html += '<div class="social-stat">' +
        '<div class="social-stat-icon material-symbols-outlined">' + config.icon + '</div>' +
        '<div class="social-stat-value">' + value + '</div>' +
        '<div class="social-stat-label">' + config.label + '</div>' +
      '</div>';
    });
    html += '</div>';
    body.innerHTML = html;
  }

  function renderAll(data) {
    dashboardData = data;

    renderHotList(currentPlatform);
    renderNews(data.feeds && data.feeds.items);
    renderTodos(data.todos && data.todos.items);

    var todayEvents = getTodayEvents(data.calendar);
    renderSchedule(todayEvents);

    renderWeather(data.weather);
    renderSocial(data.social && data.social.accounts);
  }

  // ===== 加载 Dashboard 数据 =====
  async function loadDashboard() {
    try {
      var data = await api.getDashboard();
      currentData = data;

      // 更新空卡片定时器
      updateEmptyTimers(data);

      // 检测新状态
      var newState = getEffectiveState(data);

      if (newState !== currentState) {
        // 状态变化，执行动画
        var oldState = currentState;
        currentState = newState;

        // 渲染数据（包括空状态文案）
        renderAll(data);

        // 计算需要隐藏/显示的卡片
        var toHide = getHiddenCards(oldState, newState);
        var toShow = getShownCards(oldState, newState);

        // 执行动画
        if (toHide.length) await hideCards(toHide);
        flipLayout(oldState, newState);
        if (toShow.length) await showCards(toShow);
      } else {
        // 状态未变化，只更新数据
        renderAll(data);
      }
    } catch (e) {
      // 静默失败
    }
  }

  // ===== 初始化 =====
  loadDashboard();
  setInterval(loadDashboard, 30000);

  // 初始布局
  currentState = detectState(dashboardData || { todos: { items: [] }, calendar: { events: [] } });
  applyLayout(currentState);

  // 页面加载动画
  gsap.from('.card', {
    autoAlpha: 0,
    y: 20,
    duration: 0.5,
    stagger: 0.1,
    ease: 'power2.out'
  });

  // ===== resize 监听 =====
  var resizeTimeout;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(function () {
      if (currentData) {
        var newState = getEffectiveState(currentData);
        if (newState !== currentState) {
          var oldState = currentState;
          currentState = newState;
          flipLayout(oldState, newState);
        } else {
          // 只是旋转，重新应用布局
          applyLayout(currentState);
        }
      }
    }, 100);
  });

  // ===== 事件绑定 =====
  document.getElementById('hotTabs').addEventListener('click', function (e) {
    var tab = e.target.closest('.tab');
    if (!tab) return;
    this.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
    tab.classList.add('active');
    currentPlatform = tab.getAttribute('data-platform');
    renderHotList(currentPlatform);
  });

  document.getElementById('todoBody').addEventListener('click', function (e) {
    var check = e.target.closest('.todo-check');
    if (!check) return;
    var id = parseInt(check.getAttribute('data-id'), 10);
    var todo = todos.find(function (t) { return t.id === id; });
    if (!todo) return;
    var prevCompleted = todo.completed;
    todo.completed = !prevCompleted;
    renderTodos(todos);
    api.updateTodo(id, { completed: todo.completed }).catch(function () {
      todo.completed = prevCompleted;
      renderTodos(todos);
      app.showToast('操作失败', 'error');
    });
  });

})();
</script>
</body>
</html>
