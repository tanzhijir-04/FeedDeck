<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="referrer" content="no-referrer"/>
<title>FeedDeck</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/base.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Flip.min.js"></script>
<style>
/* ===== GRID ===== */
.grid {
  width: 100vw;
  height: 100vh;
  display: grid;
  gap: var(--gap);
  padding: var(--gap);
}

/* ===== HOT SEARCH ===== */
.hot-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.hot-list::-webkit-scrollbar { display: none; }
.hot-list { -ms-overflow-style: none; scrollbar-width: none; }

.hot-item {
  display: flex;
  align-items: center;
  gap: var(--gap);
  padding: var(--gap) var(--card-pad);
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
}

.hot-item:last-child { border-bottom: none; }

.hot-item:active {
  background: var(--surface-alt);
}

.hot-rank {
  width: var(--rank-size);
  height: var(--rank-size);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display-en), Georgia, serif;
  font-size: var(--text-lg);
  font-weight: 600;
  flex-shrink: 0;
}

.hot-rank.top { background: var(--primary); color: #fff; }
.hot-rank.normal { background: var(--surface-alt); color: var(--text-muted); }

.hot-content {
  flex: 1;
  min-width: 0;
  overflow: hidden;
}

.hot-text {
  display: block;
  font-size: var(--text-sm);
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1.3;
}

.hot-heat {
  font-family: var(--font-display-en), Georgia, serif;
  font-size: var(--text-lg);
  color: var(--text-muted);
  flex-shrink: 0;
  white-space: nowrap;
  margin-left: var(--gap);
}

/* ===== NEWS ===== */
.news-item {
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
}

.news-item:last-child { border-bottom: none; }

.news-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 2px;
}

.news-source {
  font-size: var(--text-lg);
  color: var(--text-muted);
  font-weight: 500;
}

.news-title {
  font-size: var(--text-xl);
  font-weight: 500;
  color: var(--text);
  line-height: 1.4;
}

.news-time {
  font-size: var(--text-lg);
  color: var(--text-muted);
  margin-top: 2px;
}

/* ===== TODOS ===== */
.todo-item {
  display: flex;
  align-items: center;
  gap: var(--gap);
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
}

.todo-item:last-child { border-bottom: none; }

.todo-check {
  width: var(--check-size); height: var(--check-size);
  border: 2px solid var(--text-muted);
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: transparent;
}

.todo-check:hover { border-color: var(--primary); }

.todo-check.done {
  background: var(--primary);
  border-color: var(--primary);
}

.todo-check.done::after {
  content: '✓';
  color: #fff;
  font-size: var(--text-base);
  font-weight: 700;
}

.todo-text {
  flex: 1;
  font-size: var(--text-xl);
  color: var(--text);
}

.todo-item.done .todo-text {
  text-decoration: line-through;
  color: var(--text-muted);
}

.todo-deadline {
  font-size: var(--text-lg);
  color: var(--text-muted);
  flex-shrink: 0;
}

.todo-deadline.overdue { color: var(--error); font-weight: 500; }

/* ===== SCHEDULE ===== */
.schedule-item {
  display: flex;
  gap: var(--gap);
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
}

.schedule-item:last-child { border-bottom: none; }

.schedule-time {
  font-family: var(--font-display-en), Georgia, serif;
  font-size: var(--text-xs);
  color: var(--text-muted);
  width: 80px;
  flex-shrink: 0;
  font-weight: 400;
  padding-top: 1px;
}

.schedule-dot {
  width: var(--dot-size); height: var(--dot-size);
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 4px;
}

.schedule-content { flex: 1; }

.schedule-title {
  font-size: var(--text-xl);
  font-weight: 500;
  color: var(--text);
}

.schedule-desc {
  font-size: var(--text-lg);
  color: var(--text-muted);
  margin-top: 1px;
}

/* ===== WEATHER — Editorial Style (Adaptive) ===== */
.weather-editorial {
  overflow: hidden;
  align-content: start;
}

.weather-editorial .card-body {
  padding: 0;
}

/* 主容器 */
.weather-editorial .wx-container {
  display: flex;
  flex-direction: column;
}

/* 头部区域 */
.wx-header {
  padding: var(--card-pad);
  padding-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.wx-header-left {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.wx-city {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 400;
  color: var(--text);
  letter-spacing: -0.3px;
}

.wx-desc-row {
  display: flex;
  align-items: baseline;
  gap: var(--gap);
}

.wx-desc {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 400;
  color: var(--text-dim);
}

.wx-update {
  font-size: var(--text-xs);
  color: var(--text-muted);
}

.wx-header-right {
  display: flex;
  align-items: center;
  gap: var(--gap);
}

.wx-icon-main {
  font-size: var(--icon-xl);
  color: var(--coral);
}

.wx-temp-row {
  display: flex;
  align-items: flex-start;
}

.wx-temp {
  font-family: var(--font-display-en), Georgia, serif;
  font-size: var(--text-3xl);
  font-weight: 400;
  color: var(--text);
  line-height: 1;
  letter-spacing: -1px;
}

.wx-degree {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  color: var(--text-dim);
  margin-top: 6px;
}

/* 详情网格 */
.wx-details {
  padding: 0 var(--card-pad) var(--card-pad);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--gap);
}

.wx-detail-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--card-pad) 6px;
  background: var(--surface-low);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: background 0.2s;
}

.wx-detail-item:active {
  background: var(--surface-alt);
}

.wx-detail-label {
  font-size: var(--text-base);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  margin-bottom: 3px;
}

.wx-detail-value {
  font-family: var(--font-display-en), Georgia, serif;
  font-size: var(--text-lg);
  font-weight: 500;
  color: var(--text);
}

/* 日出日落 */
.wx-sun {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--card-pad);
  background: var(--surface-low);
  border-radius: var(--radius);
  margin: 0 var(--card-pad);
}

.wx-sun-item {
  display: flex;
  align-items: center;
  gap: var(--gap);
}

.wx-sun-icon {
  font-size: var(--icon-lg);
  color: var(--coral);
}

.wx-sun-label {
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--text-muted);
}

.wx-sun-time {
  font-family: var(--font-display-en), Georgia, serif;
  font-size: var(--text-lg);
  font-weight: 500;
  color: var(--text);
}

.wx-sun-divider {
  flex: 1;
  height: 1px;
  min-width: 24px;
  background: var(--border);
  margin: 0 var(--gap);
}

/* 辅助卡片区域 */
.wx-secondary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap);
  padding: var(--card-pad);
  padding-top: var(--gap);
}

/* 空气质量卡片 */
.wx-aqi {
  padding: var(--card-pad);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  gap: var(--gap);
}

.wx-aqi-title {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: var(--text-base);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
}

.wx-aqi-title .material-symbols-outlined {
  font-size: var(--icon-md);
}

.wx-aqi-content {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}

.wx-aqi-level {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  color: var(--text);
  line-height: 1;
}

.wx-aqi-desc {
  font-size: var(--text-xs);
  color: var(--text-muted);
  margin-top: 3px;
}

.wx-aqi-bar {
  width: 4px;
  height: 32px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.wx-aqi-bar-fill {
  width: 100%;
  border-radius: 2px;
  transition: height 0.3s;
}

/* 生活建议卡片 */
.wx-tip {
  padding: var(--card-pad);
  border-radius: var(--radius);
  background: var(--primary);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
}

.wx-tip-title {
  font-size: var(--text-base);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: rgba(255,255,255,0.8);
}

.wx-tip-text {
  font-family: var(--font-display);
  font-size: var(--text-sm);
  color: #fff;
  line-height: 1.5;
}

/* ===== SOCIAL ===== */
.social-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--gap);
  height: 100%;
  align-content: center;
}

/* 单账号模式：居中放大 */
.social-single {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 4px;
}

.social-single .social-platform-icon {
  width: var(--social-avatar);
  height: var(--social-avatar);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 6px;
}

.social-single .social-platform-icon svg {
  width: var(--social-avatar-svg);
  height: var(--social-avatar-svg);
}

.social-single .social-stat-label {
  font-size: var(--text-xl);
  font-weight: 500;
  color: var(--text-muted);
  letter-spacing: 0.3px;
}

.social-single .social-stat-value {
  font-family: var(--font-display-en), Georgia, serif;
  font-size: var(--text-3xl);
  font-weight: 400;
  color: var(--text);
  line-height: 1.1;
  letter-spacing: -0.5px;
}

.social-stat {
  text-align: center;
  padding: var(--card-pad) var(--gap);
  background: var(--surface-alt);
  border-radius: var(--radius);
}

.social-stat-icon {
  font-size: var(--icon-lg);
  margin-bottom: 4px;
}

.social-stat-value {
  font-family: var(--font-display-en), Georgia, serif;
  font-size: var(--text-2xl);
  font-weight: 500;
  color: var(--text);
}

.social-stat-label {
  font-size: var(--text-lg);
  color: var(--text-muted);
  margin-top: 2px;
}

.social-stat-change {
  font-size: var(--text-lg);
  font-weight: 500;
  margin-top: 3px;
}

.social-stat-change.up { color: var(--success); }
.social-stat-change.down { color: var(--error); }

/* ===== DATA VALUES (大数字) ===== */
.data-value {
  font-family: var(--font-display-en), Georgia, serif;
  font-weight: 500;
  color: var(--text);
}

.data-label {
  font-size: var(--text-xs);
  color: var(--text-muted);
  font-weight: 400;
}

.data-change {
  font-size: var(--text-xs);
  font-weight: 500;
}

.data-change.up   { color: var(--success); }
.data-change.down { color: var(--error); }
/* ===== DATA FRESHNESS ===== */
.freshness-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  z-index: 100;
  pointer-events: none;
}

.freshness-bar-inner {
  height: 100%;
  background: var(--primary);
  transition: width 0.3s ease-out;
  border-radius: 0 2px 2px 0;
}

.freshness-bar.error .freshness-bar-inner {
  background: var(--error);
}

.freshness-status {
  position: fixed;
  bottom: var(--gap);
  right: var(--gap);
  font-size: var(--text-xs);
  color: var(--text-muted);
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 6px;
  opacity: 0.7;
  transition: opacity 0.2s;
}

.freshness-status:hover { opacity: 1; }

.freshness-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--success);
  flex-shrink: 0;
}

.freshness-dot.stale { background: var(--warning); }
.freshness-dot.error { background: var(--error); }

/* ===== EMPTY STATE ===== */
.empty-guidance {
  text-align: center;
  padding: 16px var(--card-pad);
  color: var(--text-muted);
}

.empty-guidance-text {
  font-size: var(--text-sm);
  margin-bottom: 8px;
}

.empty-guidance-link {
  font-size: var(--text-xs);
  color: var(--primary);
  text-decoration: none;
  cursor: pointer;
}

.empty-guidance-link:hover { text-decoration: underline; }

/* ===== NEWS SOURCE ===== */
.news-source {
  font-size: var(--text-xs);
  color: var(--text-muted);
  margin-right: 6px;
}
</style>
</head>
<body>

<!-- 数据新鲜度进度条 -->
<div class="freshness-bar" id="freshnessBar"><div class="freshness-bar-inner" id="freshnessBarInner"></div></div>

<!-- 数据状态指示器 -->
<div class="freshness-status" id="freshnessStatus">
  <span class="freshness-dot" id="freshnessDot"></span>
  <span id="freshnessText">加载中...</span>
</div>

<div class="grid">

  <!-- 热搜榜单 -->
  <div class="card" data-card="hotsearch">
    <div class="card-header">
      <div>
        <div class="card-title">热搜榜单</div>
        <div class="card-subtitle">实时热点追踪</div>
      </div>
      <div class="tabs" id="hotTabs" role="tablist" aria-label="热搜平台"></div>
    </div>
    <div class="card-body">
      <ul class="hot-list" id="hotList"></ul>
    </div>
  </div>

  <!-- 行业资讯 -->
  <div class="card" data-card="news">
    <div class="card-header">
      <div>
        <div class="card-title">行业资讯</div>
        <div class="card-subtitle" id="newsCount">-- 个订阅源</div>
      </div>
    </div>
    <div class="card-body" id="newsBody">
      <div class="skeleton skeleton-line w-full"></div>
      <div class="skeleton skeleton-line w-3-4"></div>
      <div class="skeleton skeleton-line w-1-2"></div>
    </div>
  </div>

  <!-- 待办事项 -->
  <div class="card" data-card="todo">
    <div class="card-header">
      <div>
        <div class="card-title">待办事项</div>
        <div class="card-subtitle" id="todoStats">-- 项待完成</div>
      </div>
    </div>
    <div class="card-body" id="todoBody">
      <div class="skeleton skeleton-line w-full"></div>
      <div class="skeleton skeleton-line w-3-4"></div>
    </div>
  </div>

  <!-- 今日日程 -->
  <div class="card" data-card="schedule">
    <div class="card-header">
      <div>
        <div class="card-title">今日日程</div>
        <div class="card-subtitle" id="scheduleDate">--</div>
      </div>
    </div>
    <div class="card-body" id="scheduleBody">
      <div class="skeleton skeleton-line w-full"></div>
      <div class="skeleton skeleton-line w-1-2"></div>
    </div>
  </div>

  <!-- 天气 -->
  <div class="card weather-editorial" data-card="weather">
    <div class="card-body" id="weatherBody">
      <div class="skeleton skeleton-line w-full" style="height:40px;"></div>
      <div class="skeleton skeleton-line w-3-4"></div>
    </div>
  </div>

  <!-- 社交媒体 -->
  <div class="card" data-card="social">
    <div class="card-header">
      <div>
        <div class="card-title">社交媒体</div>
        <div class="card-subtitle">粉丝数据概览</div>
      </div>
    </div>
    <div class="card-body" id="socialBody">
      <div class="social-single">
        <div class="social-platform-icon" style="background:#fff;">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z" fill="#ccc"/></svg>
        </div>
        <div class="social-stat-label">--</div>
        <div class="social-stat-value">--</div>
      </div>
    </div>
  </div>

</div>


<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  'use strict';

  // ===== 注册 GSAP 插件 =====
  gsap.registerPlugin(Flip);

  // ===== 数字滚动动效 =====
  // animateNumber(el, target, duration, suffix)  — target 为数字，suffix 为后缀字符串
  function animateNumber(el, target, duration, suffix) {
    if (el._animating) return;
    var start = el._currentValue != null ? el._currentValue : 0;
    if (start === target) return;
    duration = duration || 800;
    suffix = suffix || '';
    el._animating = true;
    var startTime = null;

    function ease(t) { return 1 - Math.pow(1 - t, 4); }

    function step(ts) {
      if (!startTime) startTime = ts;
      var progress = Math.min((ts - startTime) / duration, 1);
      var current = Math.round(start + (target - start) * ease(progress));
      el.textContent = current.toLocaleString() + suffix;
      if (progress < 1) {
        requestAnimationFrame(step);
      } else {
        el.textContent = target.toLocaleString() + suffix;
        el._currentValue = target;
        el._animating = false;
      }
    }
    requestAnimationFrame(step);
  }

  // 批量动画：扫描 [data-animate] 元素，自动读取 data-target 和 data-suffix
  function animateAllNumbers(container) {
    var els = (container || document).querySelectorAll('[data-animate]');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      var target = parseFloat(el.getAttribute('data-target'));
      var suffix = el.getAttribute('data-suffix') || '';
      if (!isNaN(target)) animateNumber(el, target, 800, suffix);
    }
  }

  // ===== 登录检查 =====
  api.checkAuth().catch(function () {
    window.location.href = '/';
  });

  // ===== 日期（显示在日程卡片） =====
  document.getElementById('scheduleDate').textContent = app.formatDate();

  // ===== 布局系统 =====
  var layouts = {
    landscape: {
      S0: { cols: '1fr 1fr 1fr', rows: '1fr 1fr' },
      S1: { cols: '1fr 1fr 1fr', rows: '1fr 1fr' },
      S2: { cols: '1fr 1fr 1fr', rows: '1fr 1fr' },
      S3: { cols: '1fr 1fr', rows: '1fr 1fr' }
    },
    portrait: {
      S0: { cols: '1fr 1fr', rows: '1fr 1fr 1fr' },
      S1: { cols: '1fr 1fr', rows: '1fr 1fr 1fr' },
      S2: { cols: '1fr 1fr', rows: '1fr 1fr 1fr' },
      S3: { cols: '1fr 1fr', rows: '1fr 1fr' }
    }
  };

  var cardPositions = {
    landscape: {
      S0: { hotsearch: '1 / 1', news: '2 / 1', todo: '3 / 1', schedule: '1 / 2', weather: '2 / 2', social: '3 / 2' },
      S1: { hotsearch: '1 / 1', news: '2 / 1', todo: '3 / 1', weather: '1 / 2 span 2', social: '3 / 2' },
      S2: { hotsearch: '1 / 1', news: '2 / 1', schedule: '3 / 1', weather: '1 / 2 span 2', social: '3 / 2' },
      S3: { hotsearch: '1 / 1', news: '2 / 1', weather: '1 / 2', social: '2 / 2' }
    },
    portrait: {
      S0: { hotsearch: '1 / 1', news: '2 / 1', todo: '1 / 2', schedule: '2 / 2', weather: '1 / 3', social: '2 / 3' },
      S1: { hotsearch: '1 / 1', news: '2 / 1', weather: '1 / 2', social: '2 / 2', todo: '1 / 3 span 2' },
      S2: { hotsearch: '1 / 1', news: '2 / 1', weather: '1 / 2', social: '2 / 2', schedule: '1 / 3 span 2' },

  // ===== 工具函数 =====
  function getTodayEvents(calendar) {
    var _n = new Date();
    var today = _n.getFullYear() + '-' + String(_n.getMonth() + 1).padStart(2, '0') + '-' + String(_n.getDate()).padStart(2, '0');
    return (calendar && calendar.events || []).filter(function (evt) {
      return evt.start_time && evt.start_time.slice(0, 10) === today;
    });

  function isLandscape() {

  // ===== 状态检测 =====
  function detectState(data) {
    var hasTodos = data.todos && data.todos.items && data.todos.items.length > 0;
    var hasSchedule = getTodayEvents(data.calendar).length > 0;

    if (hasTodos && hasSchedule) return 'S0';
    if (hasTodos && !hasSchedule) return 'S1';
    if (!hasTodos && hasSchedule) return 'S2';
    return 'S3';
  }

  // 隐藏状态追踪
  var hiddenByEmpty = { todo: false, schedule: false };

  function updateEmptyTimers(data) {
    var hasTodos = data.todos && data.todos.items && data.todos.items.length > 0;
    var hasSchedule = getTodayEvents(data.calendar).length > 0;

    // 待办事项
    if (hasTodos) {
      // 有数据，取消定时器并恢复显示
      if (emptyTimers.todo) {
        clearTimeout(emptyTimers.todo);
        emptyTimers.todo = null;
      }
      if (hiddenByEmpty.todo) {
        hiddenByEmpty.todo = false;
        showCards(['todo']);
      }
    } else if (!emptyTimers.todo && !hiddenByEmpty.todo) {
      // 无数据，启动5秒定时器
      emptyTimers.todo = setTimeout(function () {
        emptyTimers.todo = null;
        hiddenByEmpty.todo = true;
        hideCards(['todo']);
        flipLayout(currentState, getEffectiveState(currentData));
      }, HIDE_DELAY);
    }

    // 日程
    if (hasSchedule) {
      // 有数据，取消定时器并恢复显示
      if (emptyTimers.schedule) {
        clearTimeout(emptyTimers.schedule);
        emptyTimers.schedule = null;
      }
      if (hiddenByEmpty.schedule) {
        hiddenByEmpty.schedule = false;
        showCards(['schedule']);
      }
    } else if (!emptyTimers.schedule && !hiddenByEmpty.schedule) {
      // 无数据，启动5秒定时器
      emptyTimers.schedule = setTimeout(function () {
        emptyTimers.schedule = null;
        hiddenByEmpty.schedule = true;
        hideCards(['schedule']);
        flipLayout(currentState, getEffectiveState(currentData));
      }, HIDE_DELAY);
    }
  }

  function getEffectiveState(data) {
    var hasTodos = !hiddenByEmpty.todo && data.todos && data.todos.items && data.todos.items.length > 0;
    var hasSchedule = !hiddenByEmpty.schedule && getTodayEvents(data.calendar).length > 0;

    if (hasTodos && hasSchedule) return 'S0';
    if (hasTodos && !hasSchedule) return 'S1';
    if (!hasTodos && hasSchedule) return 'S2';
    return 'S3';
  }

  // ===== 布局应用 =====
  function applyLayout(state) {
    var orientation = getOrientation();
    var layout = layouts[orientation][state];
    var positions = cardPositions[orientation][state];

    var grid = document.querySelector('.grid');
    grid.style.gridTemplateColumns = layout.cols;
    grid.style.gridTemplateRows = layout.rows;

    // 设置每张卡片的位置和可见性
    document.querySelectorAll('[data-card]').forEach(function (card) {
      var cardId = card.getAttribute('data-card');
      if (positions[cardId]) {
        var pos = positions[cardId].split(' ');
        card.style.gridColumn = pos[0];
        card.style.gridRow = pos[1] || '';
        card.style.display = '';
      } else {
        card.style.display = 'none';
      }
    });
  }

  function getVisibleCards(state) {
    var orientation = getOrientation();
    return Object.keys(cardPositions[orientation][state]);
  }

  function getHiddenCards(oldState, newState) {
    var oldVisible = getVisibleCards(oldState);
    var newVisible = getVisibleCards(newState);
    return oldVisible.filter(function (id) { return newVisible.indexOf(id) === -1; });
  }

  function getShownCards(oldState, newState) {
    var oldVisible = getVisibleCards(oldState);
    var newVisible = getVisibleCards(newState);
    return newVisible.filter(function (id) { return oldVisible.indexOf(id) === -1; });
  }

  // ===== GSAP 动画 =====
  async function hideCards(cardIds) {
    var cards = cardIds.map(function (id) { return document.querySelector('[data-card="' + id + '"]'); }).filter(Boolean);
    if (!cards.length) return;

    // 阶段1：空态闪现（1.5秒）
    await new Promise(function (r) { setTimeout(r, 1500); });

    // 阶段2：卡片退场（250ms + stagger）
    gsap.to(cards, {
      autoAlpha: 0,
      scale: 0.96,
      duration: 0.25,
      stagger: { amount: 0.08, from: 'edges' },
      ease: 'power2.out'
    });

    // 等待退场动画完成
    await new Promise(function (r) { setTimeout(r, 350) });

    // 设置 display: none
    cards.forEach(function (card) { card.style.display = 'none'; });
  }

  function flipLayout(oldState, newState) {
    // First: 记录当前状态
    var state = Flip.getState('[data-card]');

    // Last: 应用新布局
    applyLayout(newState);

    // Invert + Play: 动画过渡
    Flip.from(state, {
      duration: 0.35,
      ease: 'power2.out',
      scale: true,
      absolute: false,
      nested: false
    });
  }

  async function showCards(cardIds) {
    var cards = cardIds.map(function (id) { return document.querySelector('[data-card="' + id + '"]'); }).filter(Boolean);
    if (!cards.length) return;

    // 取消 display: none，设置初始状态
    cards.forEach(function (card) {
      card.style.display = '';
      gsap.set(card, { autoAlpha: 0, scale: 0.96 });
    });

    // FLIP 让位
    var state = Flip.getState('[data-card]');
    applyLayout(currentState);
    Flip.from(state, { duration: 0.35, ease: 'power2.out', scale: true });

    // 渐入动画（不需要空态闪现）
    gsap.to(cards, {
      autoAlpha: 1,
      scale: 1,
      duration: 0.2,
      stagger: 0.08,
      ease: 'power2.out'
    });
  }

  function renderSocial(accounts) {
    var body = document.getElementById('socialBody');
    var configuredPlatforms = accounts ? Object.keys(accounts) : [];

    if (configuredPlatforms.length === 0) {
      body.innerHTML =
        '<div class="empty-guidance">' +
          '<div class="empty-guidance-text">添加社交媒体账号后，粉丝数据将显示在这里</div>' +
          '<a class="empty-guidance-link" href="config.html">前往配置中心添加</a>' +
        '</div>';
      return;
    }

    // 单账号：居中放大显示
    if (configuredPlatforms.length === 1) {
      var key = configuredPlatforms[0];
      var config = platformConfig[key];
      if (!config) {
        body.innerHTML = '<div class="empty-guidance"><div class="empty-guidance-text">不支持的平台</div></div>';
        return;
      }
      var data = accounts[key];
      var numVal = data && data.follower_count != null ? data.follower_count : null;
      var animateAttr = numVal != null ? ' data-animate data-target="' + numVal + '"' : '';
      body.innerHTML =
        '<div class="social-single">' +
          '<div class="social-platform-icon" style="background:' + config.color + '15;">' + config.svg + '</div>' +
          '<div class="social-stat-label">' + config.label + '</div>' +
          '<div class="social-stat-value"' + animateAttr + '>' + (numVal != null ? '0' : '--') + '</div>' +
        '</div>';
      animateAllNumbers(body);
      return;
    }

    // 多账号：网格布局
    var html = '<div class="social-grid">';
    configuredPlatforms.forEach(function (platformKey) {
      var config = platformConfig[platformKey];
      if (!config) return;

      var data = accounts[platformKey];
      var numVal = data && data.follower_count != null ? data.follower_count : null;
      var animateAttr = numVal != null ? ' data-animate data-target="' + numVal + '"' : '';

      html += '<div class="social-stat">' +
        '<div class="social-stat-icon">' + config.svg + '</div>' +
        '<div class="social-stat-value"' + animateAttr + '>' + (numVal != null ? '0' : '--') + '</div>' +
        '<div class="social-stat-label">' + config.label + '</div>' +
      '</div>';
    });
    html += '</div>';
    body.innerHTML = html;
    animateAllNumbers(body);
  }

  function renderAll(data) {
    dashboardData = data;

    renderHotTabs(data.hotsearch && data.hotsearch.platforms || {});
    renderHotList(currentPlatform);
    renderNews(data.feeds && data.feeds.items);
    renderTodos(data.todos && data.todos.items);

    var todayEvents = getTodayEvents(data.calendar);
    renderSchedule(todayEvents);

    renderWeather(data.weather);
    renderSocial(data.social && data.social.accounts);

    // 客户端直连 B站获取粉丝数（绕过 Worker IP 被封）
    fetchBilibiliFollowers(data.social && data.social.config);
  }

  // ===== B站客户端直连（多策略） =====
  var _biliCallbackId = 0;
  var BILI_API = 'https://api.bilibili.com/x/relation/stat';

  function fetchBilibiliFollowers(socialConfig) {
    if (!socialConfig || !socialConfig.length) return;
    var biliAccount = null;
    for (var i = 0; i < socialConfig.length; i++) {
      if (socialConfig[i].platform === 'bilibili') { biliAccount = socialConfig[i]; break; }
    }
    if (!biliAccount || !biliAccount.accountId) return;

    var accountId = biliAccount.accountId;

    // 策略 1: JSONP → 策略 2: CORS 代理
    tryJsonp(accountId, function (follower) {
      if (follower > 0) {
        reportFollower(accountId, follower);
      } else {
        tryCorsProxy(accountId, function (follower2) {
          if (follower2 > 0) reportFollower(accountId, follower2);
        });
      }
    });
  }

  function tryJsonp(accountId, callback) {
    var cbName = '_biliCb' + (++_biliCallbackId);
    var done = false;
    var timer = null;

    function finish(follower) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
      var s = document.getElementById('bili-jsonp-' + _biliCallbackId);
      if (s) s.remove();
      callback(follower);
    }

    window[cbName] = function (res) {
      if (res && res.code === 0 && res.data && res.data.follower > 0) {
        finish(res.data.follower);
      } else { finish(0); }
    };

    var script = document.createElement('script');
    script.id = 'bili-jsonp-' + _biliCallbackId;
    script.src = BILI_API + '?vmid=' + accountId + '&callback=' + cbName;
    script.onerror = function () { finish(0); };
    document.head.appendChild(script);
    timer = setTimeout(function () { finish(0); }, 6000);
  }

  function tryCorsProxy(accountId, callback) {
    var proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(BILI_API + '?vmid=' + accountId);
    fetch(proxyUrl, { signal: AbortSignal.timeout(8000) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (res) {
        if (res.code === 0 && res.data && res.data.follower > 0) callback(res.data.follower);
        else callback(0);
      })
      .catch(function () { callback(0); });
  }

  function reportFollower(accountId, follower) {
    fetch('/api/social/client-update', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ platform: 'bilibili', accountId: accountId, followerCount: follower })
    }).then(function (r) {
      if (r.ok) {
        var valEl = document.querySelector('[data-card="social"] .social-stat-value');
        if (valEl) {
          valEl._currentValue = null; // 重置，从当前显示值动画到新值
          animateNumber(valEl, follower, 800);
        }
      }
    }).catch(function () {});
  }

  // ===== 加载 Dashboard 数据 =====
  async function loadDashboard() {
    try {
      var data = await api.getDashboard();
      currentData = data;
      lastFetchTime = Date.now();
      fetchFailCount = 0;

      // 更新空卡片定时器
      updateEmptyTimers(data);

      // 检测新状态
      var newState = getEffectiveState(data);

      if (newState !== currentState) {
        // 状态变化，执行动画
        var oldState = currentState;
        currentState = newState;

        // 渲染数据（包括空状态文案）
        renderAll(data);

        // 计算需要隐藏/显示的卡片
        var toHide = getHiddenCards(oldState, newState);
        var toShow = getShownCards(oldState, newState);

        // 执行动画
        if (toHide.length) await hideCards(toHide);
        flipLayout(oldState, newState);
        if (toShow.length) await showCards(toShow);
      } else {
        // 状态未变化，只更新数据
        renderAll(data);
      }

      updateFreshnessIndicator();
    } catch (e) {
      fetchFailCount++;
      updateFreshnessIndicator();
      if (fetchFailCount <= 3) {
        app.showToast('数据更新失败，30秒后重试', 'error');
      }
    }
  }

  // ===== 初始化 =====
  loadDashboard();
  setInterval(loadDashboard, 30000);

  // 初始布局
  currentState = detectState(dashboardData || { todos: { items: [] }, calendar: { events: [] } });
  applyLayout(currentState);

  // 页面加载动画（尊重 reduced-motion 偏好）
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    gsap.from('.card', {
      autoAlpha: 0,
      y: 20,
      duration: 0.5,
      stagger: 0.1,
      ease: 'power2.out'
    });
  }

  // ===== resize 监听 =====
  var resizeTimeout;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(function () {
      if (currentData) {
        var newState = getEffectiveState(currentData);
        if (newState !== currentState) {
          var oldState = currentState;
          currentState = newState;
          flipLayout(oldState, newState);
        } else {
          // 只是旋转，重新应用布局
          applyLayout(currentState);
        }
      }
    }, 100);
  });

  // ===== 事件绑定 =====
  document.getElementById('hotTabs').addEventListener('click', function (e) {
    var tab = e.target.closest('.tab');
    if (!tab) return;
    this.querySelectorAll('.tab').forEach(function (t) {
      t.classList.remove('active');
      t.setAttribute('aria-selected', 'false');
      t.setAttribute('tabindex', '-1');
    });
    tab.classList.add('active');
    tab.setAttribute('aria-selected', 'true');
    tab.setAttribute('tabindex', '0');
    tab.focus();
    currentPlatform = tab.getAttribute('data-platform');
    renderHotList(currentPlatform);
  });

  // 键盘导航：左右方向键切换热搜平台标签
  document.getElementById('hotTabs').addEventListener('keydown', function (e) {
    var tabs = Array.from(this.querySelectorAll('.tab'));
    var current = tabs.findIndex(function (t) { return t.getAttribute('aria-selected') === 'true'; });
    if (current === -1) return;
    var next = -1;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      next = (current + 1) % tabs.length;
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      next = (current - 1 + tabs.length) % tabs.length;
    }
    if (next !== -1) {
      e.preventDefault();
      tabs[next].click();
    }
  });

  // 数据新鲜度定时更新
  setInterval(updateFreshnessIndicator, 10000);

  document.getElementById('todoBody').addEventListener('click', function (e) {
    var check = e.target.closest('.todo-check');
    if (!check) return;
    var id = parseInt(check.getAttribute('data-id'), 10);
    var todo = todos.find(function (t) { return t.id === id; });
    if (!todo) return;
    var prevCompleted = todo.completed;
    todo.completed = !prevCompleted;
    renderTodos(todos);
    api.updateTodo(id, { completed: todo.completed }).catch(function () {
      todo.completed = prevCompleted;
      renderTodos(todos);
      app.showToast('操作失败', 'error');
    });
  });

})();
