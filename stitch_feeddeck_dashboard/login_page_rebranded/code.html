<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FeedDeck Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&amp;family=Inter:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        theme: {
          extend: {
            "colors": {
                    "canvas": "#faf9f5",
                    "surface-card": "#efe9de",
                    "primary": "#cc785c",
                    "hairline": "#d2cec9",
                    "on-surface": "#1c1c1a",
                    "surface-dim": "#54433e",
                    "error": "#ba1a1a"
            },
            "fontFamily": {
                    "sans": ["Inter", "sans-serif"],
                    "display": ["Cormorant Garamond", "Newsreader", "serif"]
            }
          }
        }
      }
    </script>
<style>
        body {
            background-color: #faf9f5;
            color: #1c1c1a;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        
        .login-card {
            background-color: #efe9de;
            border: 1px solid rgba(210, 206, 201, 0.5);
            border-radius: 8px;
            padding: 48px 32px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .input-field {
            background-color: #faf9f5;
            border: 1px solid #d2cec9;
            color: #1c1c1a;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #cc785c;
            box-shadow: 0 0 0 2px rgba(204, 120, 92, 0.15);
        }
        
        .input-error {
            border-color: #ba1a1a;
        }
        
        .input-error:focus {
            box-shadow: 0 0 0 2px rgba(186, 26, 26, 0.15);
        }
    </style>
</head>
<body class="antialiased">
<div class="login-card flex flex-col items-center">
<!-- Header -->
<div class="text-center mb-8">
<h1 class="font-display text-[36px] text-on-surface font-normal mb-2 tracking-[-0.5px] flex items-center justify-center gap-2">
    FeedDeck <span class="text-[#cc785c] text-[24px] mb-2">✻</span>
</h1>
<p class="font-sans text-[14px] text-surface-dim">信息流仪表板</p>
</div>
<!-- Form -->
<form class="w-full flex flex-col gap-6" id="loginForm" onsubmit="event.preventDefault(); showError();">
<!-- Password Input -->
<div class="flex flex-col gap-1 w-full relative">
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-surface-dim opacity-70 text-[20px]">lock</span>
<input class="input-field w-full h-[48px] pl-[40px] pr-3 font-sans text-[14px] placeholder-surface-dim placeholder-opacity-50" id="password" placeholder="请输入密码" required="" type="password"/>
</div>
<!-- Error Message Placeholder (Hidden by default) -->
<div class="hidden flex items-center gap-1 mt-1 text-error font-sans text-[12px]" id="errorMessage">
<span class="material-symbols-outlined text-[14px]">error</span>
<span>密码错误，请重试</span>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-[48px] mt-2 bg-primary text-white rounded-[8px] font-sans text-[14px] font-medium hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                登录
</button>
<!-- Optional subtle action -->
<div class="text-center mt-4">
<a class="font-sans text-[13px] text-surface-dim hover:text-primary transition-colors opacity-80 hover:opacity-100 underline decoration-hairline underline-offset-4" href="#">
                    忘记密码？
                </a>
</div>
</form>
</div>
<script>
        // Simple micro-interaction to demonstrate error state as requested
        function showError() {
            const pwdInput = document.getElementById('password');
            const errMsg = document.getElementById('errorMessage');
            
            // Add error classes
            pwdInput.classList.add('input-error');
            errMsg.classList.remove('hidden');
            
            // Add slight shake animation
            const card = document.querySelector('.login-card');
            card.animate([
                { transform: 'translateX(0)' },
                { transform: 'translateX(-5px)' },
                { transform: 'translateX(5px)' },
                { transform: 'translateX(-5px)' },
                { transform: 'translateX(5px)' },
                { transform: 'translateX(0)' }
            ], {
                duration: 400,
                easing: 'ease-in-out'
            });

            // Focus back on input
            pwdInput.focus();
            
            // Reset after 3 seconds for demo purposes
            setTimeout(() => {
                pwdInput.classList.remove('input-error');
                errMsg.classList.add('hidden');
            }, 3000);
        }
        
        // Clear error on input
        document.getElementById('password').addEventListener('input', function() {
            this.classList.remove('input-error');
            document.getElementById('errorMessage').classList.add('hidden');
        });
    </script>
</body></html>
